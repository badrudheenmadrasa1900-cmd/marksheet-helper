<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d5c31">
    <title>Page Not Found - Badrudheen Madrasa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(180deg, #e7f2ec 0%, #f4f8f5 100%);
            color: #0f2d1d;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .error-card {
            background: #ffffff;
            border-radius: 28px;
            max-width: 480px;
            width: 100%;
            padding: 40px 24px 32px;
            box-shadow: 0 10px 30px -5px rgba(13, 92, 49, 0.12), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            border: 1px solid #dcf0e4;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-circle {
            width: 84px;
            height: 84px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #ecfdf5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d5c31;
            box-shadow: 0 4px 14px rgba(13, 92, 49, 0.15);
        }

        .error-code {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1;
            color: #0d5c31;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .error-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0f2d1d;
            margin-bottom: 10px;
        }

        .error-desc {
            font-size: 0.95rem;
            color: #4b6b5a;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 52px;
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0d5c31 0%, #158043 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 6px 18px rgba(13, 92, 49, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-outline {
            background: #f8faf9;
            color: #0d5c31;
            border: 1.5px solid #c9e4d4;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #8fa79b;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="icon-circle">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">
            The requested page does not exist or has been moved. Please check the URL or return to the Student Result Portal.
        </p>

        <div class="actions-group">
            <a href="/" class="btn-action btn-primary">Go to Student Result Portal</a>
            <a href="/admin" class="btn-action btn-outline">Staff & Teacher Portal</a>
        </div>

        <p class="footer-note">Badrudheen Madrasa Examination System</p>
    </div>
</body>
</html>
